<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a1f1e"/>
      <stop offset="100%" stop-color="#47322f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d9895d"/>
      <stop offset="100%" stop-color="#f5d4bb"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Accent Frame / Ruler Markings (Industrial Design Aesthetic) -->
  <rect x="56" y="56" width="400" height="400" rx="64" fill="none" stroke="#d9895d" stroke-width="8" stroke-dasharray="24 12" opacity="0.4"/>

  <!-- Stylized Geometric Compass / Caliper / WP monogram -->
  <!-- Triangle / drafting tool -->
  <path d="M 256 120 L 380 360 L 132 360 Z" fill="none" stroke="url(#accent)" stroke-width="24" stroke-linejoin="round"/>
  
  <!-- Inner Circle (Product / Wheel / Protractor) -->
  <circle cx="256" cy="280" r="54" fill="none" stroke="#f6f0eb" stroke-width="14"/>
  <circle cx="256" cy="280" r="16" fill="#d9895d"/>

  <!-- WP2 typography -->
  <text x="256" y="440" font-family="Arial, sans-serif" font-weight="900" font-size="54" fill="#f6f0eb" text-anchor="middle" letter-spacing="4">WP 2</text>
</svg>

