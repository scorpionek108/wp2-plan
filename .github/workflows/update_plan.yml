name: Automatyczna aktualizacja planu zajęć

on:
  schedule:
    # Uruchamiaj codziennie o 04:00 UTC (ok. 06:00 czasu polskiego)
    - cron: '0 4 * * *'
    # Oraz w każdą niedzielę o 18:00 UTC (przed nowym tygodniem zajęć)
    - cron: '0 18 * * 0'
  workflow_dispatch: # Umożliwia ręczne uruchomienie jednym kliknięciem w panelu GitHub!

jobs:
  update-schedule:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja środowiska Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalacja wymaganych bibliotek
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pobranie i konwersja PDF do schedule.json
        run: |
          python scripts/update_schedule.py

      - name: Zapisanie zmian do repozytorium (jeśli plan się zmienił)
        run: |
          git config --global user.name "WP2 Bot"
          git config --global user.email "bot@pollub.local"
          if [[ -n $(git status -s schedule.json) ]]; then
            git add schedule.json
            git commit -m "Aktualizacja planu zajęć z serwera Politechniki [skip ci]"
            git push
            echo "Plan został zaktualizowany i wysłany do repozytorium."
          else
            echo "Brak zmian w planie zajęć – pomijanie commita."
          fi

